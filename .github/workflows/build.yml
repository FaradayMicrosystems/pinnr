name: Build APK

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load signing key
        env:
          KS: ${{ secrets.PINNR_KEYSTORE_B64 }}
          PW: ${{ secrets.PINNR_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::PINNR_KEYSTORE_B64 secret not set - build uses a random key and cannot update over the installed app."
            exit 0
          fi
          # Tolerate spaces/line breaks picked up when pasting.
          printf '%s' "$KS" | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          echo "::notice::PINNR_KEYSTORE_B64 received $(wc -c < "$RUNNER_TEMP/ks.b64") characters (expected 1328), starts with $(head -c 4 "$RUNNER_TEMP/ks.b64")"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/pinnr.jks" 2>/dev/null; then
            echo "::error::PINNR_KEYSTORE_B64 is not valid - paste the key from the chat again (1328 characters, starts with MIID)."
            exit 1
          fi
          PWC=$(printf '%s' "$PW" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$RUNNER_TEMP/pinnr.jks" -storepass "$PWC" -alias pinnr >/dev/null 2>&1; then
            echo "::error::Key and password don't match - re-paste the 24-character password from the chat and check PINNR_KEYSTORE_B64."
            exit 1
          fi
          echo "PINNR_KEYSTORE_FILE=$RUNNER_TEMP/pinnr.jks" >> "$GITHUB_ENV"
          echo "PINNR_KEY_PASSWORD=$PWC" >> "$GITHUB_ENV"
          echo "::add-mask::$PWC"
          echo "Signing key loaded."

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: |error:" build.log; grep -A8 "What went wrong" build.log; } | grep -v "> Task" | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/pinnr-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pinnr-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pinnr 0.7.${{ github.run_number }}${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: out/*.apk
          body: |
            Debug build for sideloading. Download the `.apk` below and open it on your phone.
            See the README for enabling Android Auto unknown sources.
