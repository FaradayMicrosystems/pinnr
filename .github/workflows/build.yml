name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: |error:" build.log; grep -A8 "What went wrong" build.log; } | grep -v "> Task" | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/pinnr-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pinnr-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pinnr build ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            Debug build for sideloading. Download the `.apk` below and open it on your phone.
            See the README for enabling Android Auto unknown sources.
